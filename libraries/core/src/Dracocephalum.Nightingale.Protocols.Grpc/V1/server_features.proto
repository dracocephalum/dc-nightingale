// Liveness and capability discovery: the first call a client makes.
//
// The wire contract is split by area the way the reference protocol is:
// server_features.proto, streams.proto, persistent_subscriptions.proto. The
// package name is part of every method path and is chosen once; the C#
// namespace is not on the wire and says "generated wire types, not the client
// API". No generated type may share a name with a segment of the enclosing C#
// namespace, and a service is named after its area, never after the product.

syntax = "proto3";

package dracocephalum.nightingale.v1;

option csharp_namespace = "Dracocephalum.Nightingale.Protocols.Grpc.V1";

service ServerFeatures {
  // Liveness, the server's version, and what its store was initialized with.
  rpc Ping (PingRequest) returns (PingResponse);
}

message PingRequest {}

message PingResponse {
  string version = 1;
  // Whether the virtual streams can be read under ordinal numbering; see
  // "Numbering" in shared.proto. A store without the feature refuses such a
  // read with ORDINALS_NOT_ENABLED.
  bool supports_ordinals = 2;
  // Whether every other call needs credentials in the authorization header;
  // see "Call metadata" in shared.proto. This call never does.
  bool authentication_required = 3;
  // Whether a read may name all tenants with the wildcard in the tenant
  // header; see "Call metadata" in shared.proto. True while the store keeps
  // one sequence across tenants; a server whose store numbers each tenant on
  // its own says false here and refuses the wildcard.
  bool supports_all_tenants = 4;
  // How the ordinal sequencer stands for the caller's sequence, on a store
  // with ordinals; unspecified on one without.
  OrdinalSequencerState ordinal_sequencer = 5;
}

enum OrdinalSequencerState {
  ORDINAL_SEQUENCER_STATE_UNSPECIFIED = 0;
  // Numbering events as they are appended.
  ORDINAL_SEQUENCER_STATE_RUNNING = 1;
  // Turned off by the server's operator: reads and subscriptions by ordinal
  // are refused with SEQUENCER_DISABLED until it is turned on again.
  ORDINAL_SEQUENCER_STATE_DISABLED = 2;
  // Failing to number the caller's sequence, and trying again: reads and
  // subscriptions by ordinal are refused with SEQUENCER_FAULTED meanwhile.
  ORDINAL_SEQUENCER_STATE_FAULTED = 3;
}
