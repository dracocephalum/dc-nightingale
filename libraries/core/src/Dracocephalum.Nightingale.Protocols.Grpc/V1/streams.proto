// Streams: read, subscribe, append, reset, archive, delete.
//
// The shape follows the reference protocol: one server-streaming Read that is
// a subscription when the request says so, one client-streaming Append that
// sends its options first, and unary calls for the rest. Message order on a Read is
// part of the contract; each response message documents when it may appear.
// Numbers, names, bodies, headers and errors are defined in shared.proto.

syntax = "proto3";

package dracocephalum.nightingale.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "shared.proto";

option csharp_namespace = "Dracocephalum.Nightingale.Protocols.Grpc.V1";

service Streams {
  // A bounded read, or a subscription, over a stream, $all, or a virtual
  // stream. Errors: STREAM_DELETED, INVALID_STREAM_NAME, FILTER_NOT_ALLOWED,
  // ORDINALS_NOT_ENABLED, SEQUENCER_DISABLED, SEQUENCER_FAULTED,
  // INVALID_ARGUMENT. A stream with no events is not
  // an error: the first and only response is stream_not_found.
  rpc Read (ReadRequest) returns (stream ReadResponse);

  // Appends events to one stream atomically: all of them, or none, under one
  // expected revision. The first request carries the options, every following
  // request one event. One append carries at most as many events as the
  // server allows, 150 unless its host says otherwise; a caller with more
  // sends several appends. Errors: REVISION_CONFLICT, STREAM_DELETED,
  // INVALID_STREAM_NAME, APPEND_SIZE_EXCEEDED, INVALID_ARGUMENT. A retry
  // with an explicit expected revision is safe; see "Event ids" in
  // shared.proto.
  rpc Append (stream AppendRequest) returns (AppendResponse);

  // Appends to several streams atomically: all of them, or none, each under
  // its own expected revision, in one commit. A part is events for a stream,
  // a header naming the stream followed by its events, or a stream's metadata
  // set as SetStreamMetadata sets it, except that a truncate_before at its
  // largest value, a reset, is refused. Checks name streams that are not
  // written: the append commits only if each is, at the commit, in the state
  // given. Each stream is written once and named by at most one condition.
  // The events are positioned stream by stream, in the order the streams are
  // given, a stream's own in its order. At most as many events as one Append
  // carries, and at most as many checks. Errors: STREAM_CONFLICTS, every
  // condition that failed in one answer; STREAM_DELETED, INVALID_STREAM_NAME,
  // APPEND_SIZE_EXCEEDED, INVALID_ARGUMENT, every problem with the request in
  // its message. A retry is safe, as for Append, when every part is events
  // under an explicit expected revision or NO_STREAM: the same events with
  // the same ids, already there, answer with what they wrote. A metadata set
  // is written with new ids each time, as SetStreamMetadata's is, so a
  // request with one is not recognised as its own retry and answers with
  // the conflict it finds.
  rpc AppendToStreams (stream AppendToStreamsRequest) returns (AppendToStreamsResponse);

  // Resets a stream, the reference's soft delete: it reads as not found
  // until its next append, which continues its revisions with every older
  // event hidden from its reads; $all and the virtual streams keep them. One
  // metadata event is written and nothing is removed, so a reset is always
  // allowed, and undone by setting the metadata twice: once to bring the
  // stream back, again to lower its truncation. A reset of a stream with no
  // events clears its metadata. Errors: REVISION_CONFLICT, STREAM_NOT_FOUND
  // (no events and no metadata), STREAM_DELETED (archived).
  rpc Reset (ResetRequest) returns (ResetResponse);

  // Archives a stream: its events leave every read, $all and the virtual
  // streams included, and appends to it fail with STREAM_DELETED; the rows
  // stay in the store. Allowed when the server's deletion level is Archive or
  // Delete. Errors: REVISION_CONFLICT, STREAM_NOT_FOUND, STREAM_DELETED,
  // DELETION_DISABLED.
  rpc Archive (ArchiveRequest) returns (ArchiveResponse);

  // Deletes a stream for good: it, its events and its metadata stream are
  // removed, and the name reads as a stream that never existed, free to be
  // used again. Allowed when the server's deletion level is Delete. Errors:
  // REVISION_CONFLICT, STREAM_NOT_FOUND, DELETION_DISABLED.
  rpc Delete (DeleteRequest) returns (DeleteResponse);

  // Reads a stream's metadata as last set: the last event of its metadata
  // stream, $$<stream>. A stream whose metadata was never set answers with
  // revision -1 and no settings, whether or not the stream has events.
  // Errors: INVALID_STREAM_NAME.
  rpc GetStreamMetadata (GetStreamMetadataRequest) returns (GetStreamMetadataResponse);

  // Sets a stream's metadata: appends one $metadata event to $$<stream>,
  // under an expected revision of that metadata stream, never of the stream
  // itself; the new metadata replaces the old as a whole. The stream need not
  // exist, so metadata can be set before its first event. On a stream that is
  // reset, the set brings it back and appends two events, as the reference
  // does: the metadata as given, then the same with truncate_before at the
  // revision the stream continues from; the response is the second. Applied to the
  // stream's reads and to where a subscription to it starts, from the next
  // read on; never to $all, the virtual streams or live delivery. Errors:
  // REVISION_CONFLICT, INVALID_STREAM_NAME, INVALID_ARGUMENT (a setting out
  // of range, a reserved key among the custom ones, or $acl, which this
  // server does not support).
  rpc SetStreamMetadata (SetStreamMetadataRequest) returns (SetStreamMetadataResponse);
}

message ReadRequest {
  // A stream name, $all, $ce-<category>, $et-<event type>, $bc-<correlation
  // id> (every event whose $correlationId is the id), $streams (the first
  // event of every stream), $category-<category> (the first event of every
  // stream in the category), $de (every event whose type does not begin
  // with $), $mde (every $metadata event, the same as $et-$metadata), or
  // $$<stream>, a stream's metadata stream. $bc-, $streams, $category- and
  // $de read by position only.
  string stream = 1;

  ReadDirection direction = 2;

  // Where to begin, inclusive, in the reading direction. For a stream the
  // number is a revision; for $all and the virtual streams it is a position.
  // A subscription with `end` delivers only events appended after it was
  // confirmed; a client that wants "everything after X" sends X + 1.
  oneof from {
    sint64 position = 3;
    google.protobuf.Empty start = 4;
    google.protobuf.Empty end = 5;
  }

  // The only difference between a read and a subscription.
  oneof mode {
    // At most this many events, then the call completes. Must be positive.
    uint64 count = 6;
    // Read to the head, report caught_up, then stay live until the client
    // cancels the call. Direction must be forwards.
    SubscriptionOptions subscription = 7;
  }

  // $all only. See shared.proto.
  Filter filter = 8;

  // How the numbers in this conversation are read: global positions, the
  // default, or the dense ordinals of a virtual stream. See "Numbering" in
  // shared.proto. Under ORDINAL, `position` above is an ordinal, and so is
  // every head, checkpoint and count the responses carry.
  Numbering numbering = 9;
}

enum ReadDirection {
  // Treated as forwards.
  READ_DIRECTION_UNSPECIFIED = 0;
  READ_DIRECTION_FORWARDS = 1;
  READ_DIRECTION_BACKWARDS = 2;
}

// Empty for now; the place for per-subscription settings later.
message SubscriptionOptions {}

message ReadResponse {
  oneof content {
    // Bounded read of an existing stream: always the first message, so a
    // client learns the stream's bounds and its head before any event.
    StreamBounds head = 1;

    // Bounded read of a stream with no events: the only message, then the
    // call completes. Never sent for $all or a virtual stream, which read as
    // empty instead, nor for a subscription, which is confirmed with head -1
    // and waits for the stream's first event.
    StreamNotFound stream_not_found = 2;

    // Subscription: always the first message.
    SubscriptionConfirmed confirmed = 3;

    RecordedEvent event = 4;

    // Subscription: the position the server has read to without an event to
    // deliver, so the client's checkpoint can advance. Sent per the filter's
    // checkpoint_interval, and after a quiet stretch on an unfiltered
    // subscription.
    Checkpoint checkpoint = 5;

    // Subscription: every event up to the head at that moment has been sent.
    // Sent once when the live phase begins, and again whenever the server
    // catches up after a fell_behind.
    CaughtUp caught_up = 6;

    // Subscription: the client is consuming slower than the stream grows.
    // Carries the head and the number of events between the client and it,
    // so a consumer can alert on a count rather than on sparse positions.
    FellBehind fell_behind = 7;
  }
}

// Revisions for a stream; positions for $all and the virtual streams. For a
// stream, `first` is the first revision its metadata's $maxCount and $tb
// leave to read, beyond `last` when they hide every event; $maxAge hides
// events by age on top of it. For $all, `first` is 0 and `last` is the
// position every event up to which has been committed, the high-water mark;
// 0 means there are no events yet.
message StreamBounds {
  sint64 first = 1;
  sint64 last = 2;
}

message StreamNotFound {
  string stream = 1;
}

message SubscriptionConfirmed {
  string subscription_id = 1;
  // The head at the moment the subscription was confirmed: the last revision
  // of a stream, or -1 when it has no events yet; the high-water mark of
  // $all, 0 when there are no events yet.
  sint64 head = 2;
}

message Checkpoint {
  sint64 position = 1;
  google.protobuf.Timestamp at = 2;
}

message CaughtUp {
  sint64 head = 1;
  google.protobuf.Timestamp at = 2;
}

message FellBehind {
  sint64 head = 1;
  sint64 events_behind = 2;
  google.protobuf.Timestamp at = 3;
}

message AppendRequest {
  oneof content {
    AppendOptions options = 1;
    ProposedEvent event = 2;
  }
}

message AppendOptions {
  string stream = 1;
  // A revision, or one of the ExpectedRevision values.
  sint64 expected_revision = 2;
}

message AppendResponse {
  // Revision and position of the last event written. A client's next append
  // to this stream expects `revision`.
  sint64 revision = 1;
  sint64 position = 2;
}

// One message of an append to several streams. The appends come in the
// order they are given, numbered from 0, and the checks after them, numbered
// on: the numbers a STREAM_CONFLICTS answer gives back. A record naming its
// own stream, for events of several streams in one order, would be a part of
// its own beside these.
message AppendToStreamsRequest {
  oneof content {
    // Begins an append of events to a stream; its events follow.
    AppendStreamHeader stream = 1;
    // An event of the append begun last.
    ProposedEvent event = 2;
    // A stream's metadata, set.
    AppendMetadata metadata = 3;
    // A condition on a stream not written.
    AppendCheck check = 4;
  }
}

message AppendStreamHeader {
  string stream = 1;
  // A revision, or one of the ExpectedRevision values.
  sint64 expected_revision = 2;
}

message AppendMetadata {
  // A plain stream's name.
  string stream = 1;
  // A revision of the metadata stream, or one of the ExpectedRevision values.
  sint64 expected_revision = 2;
  StreamMetadata metadata = 3;
}

message AppendCheck {
  string stream = 1;
  // A revision, or NO_STREAM or STREAM_EXISTS; ANY asserts nothing.
  sint64 expected_revision = 2;
}

message AppendToStreamsResponse {
  // One for each append, in the order they were given.
  repeated AppendedStream appended = 1;
}

message AppendedStream {
  // The stream written: the stream, or for a metadata set $$<stream>.
  string stream = 1;
  // Revision and position of the last event written to it.
  sint64 revision = 2;
  sint64 position = 3;
}

message ResetRequest {
  string stream = 1;
  // A revision of the stream, or one of the ExpectedRevision values.
  sint64 expected_revision = 2;
}

message ResetResponse {
  // Revision of the metadata event in the metadata stream, and its position.
  sint64 revision = 1;
  sint64 position = 2;
}

message ArchiveRequest {
  string stream = 1;
  // A revision, or one of the ExpectedRevision values.
  sint64 expected_revision = 2;
}

message ArchiveResponse {}

message DeleteRequest {
  string stream = 1;
  // A revision, or one of the ExpectedRevision values.
  sint64 expected_revision = 2;
}

message DeleteResponse {}

// A stream's metadata. Each setting is absent unless set; the event that
// stores them writes the reference's keys ($maxAge, $maxCount, $tb,
// $cacheControl, $tmp) beside the custom ones in one JSON object.
message StreamMetadata {
  // How old an event may be and still be read. Positive, whole seconds.
  google.protobuf.Duration max_age = 1;
  // How many of the stream's last events are read. Positive.
  optional int64 max_count = 2;
  // The first revision read; the events before it are hidden. Never
  // negative. Set to its largest value, the reference's soft delete, it
  // resets the stream, as Reset does, keeping the other settings; on a
  // stream that is reset, any set brings it back, from the truncation the
  // reset left, whatever this value is.
  optional int64 truncate_before = 3;
  // Carried over from the reference, without effect here: a caching hint of
  // its HTTP interface. Positive, whole seconds.
  google.protobuf.Duration cache_control = 4;
  // Carried over from the reference, without effect here: there, it asks the
  // scavenge of a deleted stream to remove its metadata too.
  optional bool temp_stream = 5;
  // The application's own keys: a UTF-8 JSON object, or empty. None of them
  // is a reserved key, nor $acl.
  bytes custom = 6;
}

message GetStreamMetadataRequest {
  // A plain stream's name.
  string stream = 1;
}

message GetStreamMetadataResponse {
  // The metadata stream's last revision, which the next set expects; -1 when
  // the metadata was never set.
  sint64 revision = 1;
  // After a reset, truncate_before is the revision the stream continues
  // from.
  StreamMetadata metadata = 2;
  // The stream is reset and not yet back: it reads as not found until its
  // next append, or the next set of its metadata.
  bool reset = 3;
}

message SetStreamMetadataRequest {
  // A plain stream's name.
  string stream = 1;
  // A revision of the metadata stream, or one of the ExpectedRevision
  // values.
  sint64 expected_revision = 2;
  StreamMetadata metadata = 3;
}

message SetStreamMetadataResponse {
  // Revision of the metadata event in the metadata stream, and its position.
  sint64 revision = 1;
  sint64 position = 2;
}
