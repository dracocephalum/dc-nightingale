// Persistent subscriptions: a named group over a stream whose checkpoint the
// server keeps, delivering each event to a connected consumer until it is
// acknowledged, retrying or parking what is not.
//
// The shape follows the reference protocol: unary Create, Update, Delete,
// GetInfo, List and ReplayParked, with ListParked, ListOutbox and SkipParked beside
// them, and one bidirectional Read whose request stream carries the
// options first and then acknowledgements, while the response stream carries
// the confirmation and the events. A group runs in one server instance at a
// time; see "Ownership" below. Numbers, names, bodies and errors are defined
// in shared.proto and errors.proto.
//
// The names here, "persistent subscription" and "group", are the reference
// protocol's, kept on purpose so the contract reads as the one its callers
// already know. The server's own types and tables say "subscription group"
// for the same thing; the difference is deliberate, and it stops at the wire.

syntax = "proto3";

package dracocephalum.nightingale.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "shared.proto";

option csharp_namespace = "Dracocephalum.Nightingale.Protocol.V1";

service PersistentSubscriptions {
  // Creates a group over a stream, $all or a virtual stream, with its
  // settings, its starting position and its numbering. Errors: GROUP_EXISTS,
  // INVALID_STREAM_NAME, ORDINALS_NOT_ENABLED, INVALID_ARGUMENT.
  rpc Create (CreateRequest) returns (CreateResponse);

  // Changes a group's settings in place: its timeouts, its retry limit, its
  // checkpoint bounds, its buffer size and its consumer limit. A field left
  // unset keeps its value. Where the group starts and how it is numbered
  // are fixed when it is created: naming another value for either is
  // refused, and a consumer that wants one deletes the group and creates it
  // again. A connected consumer's call ends with GROUP_UPDATED, so it
  // connects again under the new settings; the call is served by the
  // instance that runs the group, and another refuses with its address, as
  // for ReplayParked. Errors: GROUP_NOT_FOUND, GROUP_OWNED_ELSEWHERE,
  // INVALID_STREAM_NAME, INVALID_ARGUMENT.
  rpc Update (UpdateRequest) returns (UpdateResponse);

  // Deletes a group: its checkpoint and its parked messages go with it, and a
  // connected consumer's call ends. Errors: GROUP_NOT_FOUND.
  rpc Delete (DeleteGroupRequest) returns (DeleteGroupResponse);

  // Describes one group: its settings, its checkpoint, what is parked and on
  // its outbox, the last number of its stream, and where it runs. While a
  // consumer is connected the answer comes from the instance that runs the
  // group, which adds what only it knows; an instance asked for a group
  // another runs refuses with that instance's address, as Read does. A group
  // nobody runs is described by any instance. Errors: GROUP_NOT_FOUND,
  // GROUP_OWNED_ELSEWHERE, INVALID_STREAM_NAME, INVALID_ARGUMENT.
  rpc GetInfo (GetInfoRequest) returns (GetInfoResponse);

  // Lists the groups, every one or those of one stream, each with what the
  // store holds about it. Any instance answers, and none redirects: groups
  // run in whichever instance their consumer reached, so no instance has
  // them all in memory. A running group writes how it stands to the store
  // each time it renews its lease, and the listing carries that: the live
  // numbers as they were at as_of, a few seconds old. The groups the
  // answering instance runs itself are the exception: their numbers are as
  // of now, and from_owner says which is which. GetInfo gives them as they
  // are now, for one group. Errors: INVALID_STREAM_NAME.
  rpc List (ListRequest) returns (ListResponse);

  // Connects a consumer to a group. The first request carries the options;
  // every following request acknowledges or refuses delivered events. The
  // first response is the confirmation; every following one is an event with
  // its retry count. An event not acknowledged within the group's message
  // timeout is redelivered; one refused with park, or retried past the
  // group's limit, is parked. The call ends with GROUP_UPDATED when the
  // group's settings are changed under it. Errors: GROUP_NOT_FOUND,
  // GROUP_OWNED_ELSEWHERE, CONSUMER_LIMIT_REACHED, GROUP_UPDATED,
  // INVALID_ARGUMENT.
  rpc Read (stream PersistentReadRequest) returns (stream PersistentReadResponse);

  // Moves parked messages to the group's outbox, from which they are
  // delivered again ahead of the stream: all of them, one by its number, or
  // every one below a number.
  // A consumer connected to the instance that serves the call receives them
  // at once; otherwise they are delivered at the next connection. Idempotent:
  // a message already on the outbox is counted and left there. A message
  // that fails again goes back to parked. Errors: GROUP_NOT_FOUND,
  // PARKED_MESSAGE_NOT_FOUND.
  rpc ReplayParked (ReplayParkedRequest) returns (ReplayParkedResponse);

  // Lists a group's parked messages in the order of their numbers, a page at
  // a time: which event each is, why it was parked and at which retry
  // count. Any instance answers; the rows are the store's. Errors:
  // GROUP_NOT_FOUND, INVALID_STREAM_NAME, INVALID_ARGUMENT.
  rpc ListParked (ListMessagesRequest) returns (ListParkedResponse);

  // Lists the messages on a group's outbox, the same way: parked messages a
  // replay put back, not delivered yet. Errors: GROUP_NOT_FOUND,
  // INVALID_STREAM_NAME, INVALID_ARGUMENT.
  rpc ListOutbox (ListMessagesRequest) returns (ListOutboxResponse);

  // Removes parked messages for good, so the group never delivers them: all
  // of them, one by its number, or every one below a number. The events
  // stay in their streams; only the group's record of them goes. A message
  // on the outbox is not parked and is not touched. Any instance answers.
  // Errors: GROUP_NOT_FOUND, PARKED_MESSAGE_NOT_FOUND, INVALID_STREAM_NAME,
  // INVALID_ARGUMENT.
  rpc SkipParked (SkipParkedRequest) returns (SkipParkedResponse);
}

message CreateRequest {
  string stream = 1;
  string group = 2;
  GroupSettings settings = 3;
}

message CreateResponse {}

// What the server keeps for a group. Defaults are the reference's where it
// has them.
message GroupSettings {
  // Where the group starts: the first event, the next event after creation,
  // or an explicit position (a revision for a stream, a position for $all and
  // the virtual streams), inclusive. Default: end.
  oneof start {
    google.protobuf.Empty from_start = 1;
    google.protobuf.Empty from_end = 2;
    sint64 from_position = 3;
  }

  // How long a delivered event may stay unacknowledged before it is
  // redelivered. Default 30 seconds.
  google.protobuf.Duration message_timeout = 4;

  // How many times an event is redelivered before it is parked. Default 10.
  int32 max_retry_count = 5;

  // The checkpoint is written when this many events have been acknowledged
  // since the last write, or when checkpoint_after has passed with at least
  // checkpoint_lower_bound acknowledged. Defaults 1000, 2 seconds, 10.
  int32 checkpoint_upper_bound = 6;
  google.protobuf.Duration checkpoint_after = 7;
  int32 checkpoint_lower_bound = 8;

  // How many events the server reads ahead of the consumer. Default 500.
  int32 buffer_size = 9;

  // How many consumers may connect at once. Only 1 is served today; see
  // PENDING.md for competing consumers.
  int32 max_subscriber_count = 10;

  // How the group's numbers are meant, fixed when the group is created: its
  // start position, its checkpoint, and the position a parked message is
  // replayed by are all in this numbering, and every event it delivers
  // carries its ordinal under ORDINAL. See "Numbering" in shared.proto.
  // ORDINAL is refused with INVALID_ARGUMENT on a plain stream or $all and
  // with ORDINALS_NOT_ENABLED on a store without ordinals. A consumer that
  // wants the other numbering creates another group.
  Numbering numbering = 11;
}

message UpdateRequest {
  string stream = 1;
  string group = 2;
  // The settings to change; an unset field keeps its value.
  GroupSettings settings = 3;
}

message UpdateResponse {
  // The group's settings after the change, all of them.
  GroupSettings settings = 1;
}

message DeleteGroupRequest {
  string stream = 1;
  string group = 2;
}

message DeleteGroupResponse {}

message GetInfoRequest {
  string stream = 1;
  string group = 2;
}

message GetInfoResponse {
  GroupInfo info = 1;
}

message ListRequest {
  // The stream whose groups are listed; empty lists every group.
  string stream = 1;
}

message ListResponse {
  // Ordered by stream, then by group.
  repeated GroupInfo groups = 1;
}

// A group as the server describes it. Fields 1 to 9 are what the store
// holds and are in every answer; last_known_position is only in the answer
// of GetInfo.
message GroupInfo {
  // The names the group was created with.
  string stream = 1;
  string group = 2;

  GroupSettings settings = 3;
  google.protobuf.Timestamp created_at = 4;

  // The last number every event up to which is done, in the group's
  // numbering. Absent when the group has no checkpoint yet.
  optional sint64 checkpoint = 5;

  // How many messages are parked, and how many wait on the outbox to be
  // delivered ahead of the stream.
  int64 parked_count = 6;
  int64 outbox_count = 7;

  // Whether an instance runs the group now, which it does while a consumer
  // is connected, and where that instance is reached; empty when none runs
  // it or it advertises no address.
  bool running = 8;
  string owner_address = 9;

  // The last number of the group's stream, in the group's numbering. Absent
  // when the stream holds nothing, and in List.
  optional sint64 last_known_position = 10;

  // How the running group stands. From GetInfo answered by the instance
  // that runs the group it is as of now; in List, and from GetInfo answered
  // by an instance that could not send the client to the owner, it is what
  // the group last wrote to the store. Absent when the group is not running.
  GroupLiveInfo live = 11;
}

message GroupLiveInfo {
  // When the consumer connected.
  google.protobuf.Timestamp connected_at = 1;
  // Events delivered and neither acknowledged nor refused yet.
  int32 in_flight_count = 2;
  // Events queued to be delivered again.
  int32 awaiting_retry_count = 3;
  // How many delivered, unacknowledged events the consumer asked to hold.
  int32 consumer_buffer_size = 4;
  // The group's checkpoint as the running group has it, which may be ahead
  // of the one written to the store. Absent when there is none yet.
  optional sint64 checkpoint = 5;
  // When the oldest event still in flight was delivered: a consumer that is
  // connected and not answering shows here. Absent when nothing is in flight.
  google.protobuf.Timestamp oldest_in_flight_at = 6;
  // Where the consumer connected from, as the server saw it.
  string consumer_address = 7;
  // When these numbers were taken.
  google.protobuf.Timestamp as_of = 8;
  // Where these numbers came from: true when the instance that answered
  // runs the group and read them from the running group, so they are as of
  // now; false when they are what the group last wrote to the store.
  bool from_owner = 9;
}

message PersistentReadRequest {
  oneof content {
    // First message.
    PersistentReadOptions options = 1;
    // These events are done.
    Ack ack = 2;
    // These events are not done; the action says what happens to them.
    Nack nack = 3;
  }
}

message PersistentReadOptions {
  string stream = 1;
  string group = 2;
  // How many delivered, unacknowledged events the consumer holds at once; the
  // server sends no more until some are acknowledged. Default 10.
  int32 buffer_size = 3;
}

message Ack {
  // Event ids, in their canonical UUID form. At most 2000 per message.
  repeated string ids = 1;
}

message Nack {
  repeated string ids = 1;
  NackAction action = 2;
  string reason = 3;
}

enum NackAction {
  // Treated as retry.
  NACK_ACTION_UNSPECIFIED = 0;
  // Park the events now, whatever their retry count.
  NACK_ACTION_PARK = 1;
  // Redeliver, counting a retry; parked when the limit is reached.
  NACK_ACTION_RETRY = 2;
  // Acknowledge without processing: the events are done and not parked.
  NACK_ACTION_SKIP = 3;
}

message PersistentReadResponse {
  oneof content {
    // Always the first message.
    PersistentSubscriptionConfirmed confirmed = 1;
    PersistentEvent event = 2;
  }
}

message PersistentSubscriptionConfirmed {
  string subscription_id = 1;
  // The group's checkpoint at that moment: the last position every event up
  // to which is acknowledged, or -1 when nothing is yet. In the group's
  // numbering: a revision for a stream, a position for $all, a position or
  // an ordinal for a virtual stream as the group was created.
  sint64 checkpoint = 2;
}

message PersistentEvent {
  RecordedEvent event = 1;
  // How many times this event was delivered before this time; 0 on the first
  // delivery.
  int32 retry_count = 2;
}

message ReplayParkedRequest {
  string stream = 1;
  string group = 2;
  oneof which {
    // Every parked message, in the order they were parked.
    google.protobuf.Empty all = 3;
    // The parked message with this position, in the group's numbering.
    sint64 position = 4;
    // Every parked message below this number, in the group's numbering.
    sint64 before = 5;
  }
}

message ReplayParkedResponse {
  // How many messages were put back.
  int32 replayed = 1;
}

message ListMessagesRequest {
  string stream = 1;
  string group = 2;
  // Only messages above this number, in the group's numbering: the last
  // number of the page before. Absent for the first page.
  optional sint64 after = 3;
  // The most messages to return: 100 when not set, 1000 at most.
  int32 limit = 4;
}

message ParkedMessage {
  // The event's number in the group's numbering, the one ReplayParked and
  // SkipParked take: a revision for a group over a stream, a position over
  // $all or a virtual stream, an ordinal for a group created under ORDINAL.
  sint64 number = 1;
  string event_id = 2;
  // Why it was parked: the consumer's reason, or that its retries were spent.
  string reason = 3;
  // Its retry count when it was parked: how many times it had been
  // delivered again. A replay delivers it with this count.
  int32 retry_count = 4;
  google.protobuf.Timestamp parked_at = 5;
  // The event's global position and its revision within its own stream,
  // whichever the group counts by.
  sint64 position = 6;
  sint64 revision = 7;
}

message ListParkedResponse {
  repeated ParkedMessage messages = 1;
}

message OutboxMessage {
  sint64 number = 1;
  string event_id = 2;
  string reason = 3;
  // The retry count it is delivered with.
  int32 retry_count = 4;
  // When it becomes deliverable.
  google.protobuf.Timestamp due_at = 5;
  sint64 position = 6;
  sint64 revision = 7;
}

message ListOutboxResponse {
  repeated OutboxMessage messages = 1;
}

message SkipParkedRequest {
  string stream = 1;
  string group = 2;
  oneof which {
    // Every parked message.
    google.protobuf.Empty all = 3;
    // The parked message with this position, in the group's numbering.
    sint64 position = 4;
    // Every parked message below this number, in the group's numbering.
    sint64 before = 5;
  }
}

message SkipParkedResponse {
  // How many messages were removed.
  int32 skipped = 1;
}
