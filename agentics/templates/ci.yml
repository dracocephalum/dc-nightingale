# Builds, tests and deploys every push to the default branch that changes
# what a package is built from, as a ci build: its packages go to the
# host's own package registry as a ci version, and the oldest ci versions
# there are removed. A repository that packs nothing never deploys.
# Releases are not made here, and pull requests are dev.yml's.
#
# Copied from agentics/templates/ci.yml, with build.yml beside it. The
# list under `on:` is the repository's own; the rest is used as it is.
# agentics/rules/delivery/github.md has the reasons.
name: CI

on:
  push:
    branches: [main]
    # What a package is built from, and nothing else. A change that touches
    # none of these starts no run and publishes nothing: a change to a
    # document, and a change to code that is never published.
    # agentics/rules/scrub.md checks the list against the tree.
    paths:
      # The pipeline itself, and the steps it shares.
      - .github/workflows/ci.yml
      - .github/workflows/build.yml
      # What every project inherits from the root, and what decides the
      # bytes of a checkout.
      - .editorconfig
      - .gitattributes
      - BannedSymbols.txt
      - Directory.Build.props
      - Directory.Build.targets
      - Directory.Packages.props
      - global.json
      - nuget.config
      - Packaging.props
      - StyleCop.props
      - stylecop.json
      - stylecop.ruleset
      - Version.props
      # What is packed beside the assemblies.
      - NOTICE
      # The code that is published. This one is a standalone repository's;
      # a monorepo names in its place the category folders whose components
      # are published, 'libraries/**' and 'services/**' say, and leaves out
      # those that never are, 'tools/**' and 'examples/**'. Tests are not
      # on the list either: a change to them alone was built and run by
      # dev.yml, and gives no package that differs from the last.
      - 'src/**'
      # No document is built. One that is packed, or read by a build, is
      # named after this line, which then no longer takes it away.
      - '!**/*.md'
      # A package's own page, PACKAGE.md beside a project file, is packed.
      # Its entry is added with the first one, and to dev.yml as well; until
      # then it would match nothing, which the scrub reports.
      # - '**/PACKAGE.md'

# A run on the default branch is never cancelled, since it deploys.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    # TEMPORARY, 1 of 3, and commented out: for a repository that builds
    # against a ci version another repository published to the host's
    # registry. The other two are in build.yml, and all three are taken
    # together or not at all.
    # permissions:
    #   contents: read
    #   packages: read
    uses: ./.github/workflows/build.yml
    with:
      build-kind: ci
      pack: true

  deploy:
    name: Deploy
    needs: build
    if: needs.build.outputs.packed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # The run's own token: it may write this repository's packages and
      # nothing else, and it is gone when the run ends. No secret is stored.
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
      KEEP_CI_VERSIONS: 20
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      # A run that is started again keeps its number, so its versions may be
      # there already: those are passed over, and the job can be repeated.
      - name: Publish to GitHub Packages
        run: >
          dotnet nuget push "packages/*.nupkg"
          --source "https://nuget.pkg.github.com/$OWNER/index.json"
          --api-key "$GH_TOKEN"
          --skip-duplicate
      # The registry's space is limited, and a ci version is of no use once
      # a few newer ones exist. Only ci versions are removed: a release
      # published here, if there ever is one, stays.
      - name: Remove old ci versions
        run: |
          set -euo pipefail
          case "$(gh api "users/$OWNER" --jq .type)" in
            Organization) scope="orgs/$OWNER" ;;
            *) scope="users/$OWNER" ;;
          esac
          for file in packages/*.nupkg; do
            name="$(basename "$file" | sed -E 's/\.[0-9]+\.[0-9]+\.[0-9]+.*$//')"
            gh api --paginate "$scope/packages/nuget/$name/versions" \
              --jq '.[] | select(.name | test("-ci\\.")) | "\(.created_at) \(.id) \(.name)"' \
              | sort -r | tail -n "+$((KEEP_CI_VERSIONS + 1))" \
              | while read -r _ id version; do
                  echo "Removing $name $version"
                  gh api -X DELETE "$scope/packages/nuget/$name/versions/$id"
                done
          done
